; ClaudeScreen firmware for the ESP32-2432S028 ("Cheap Yellow Display").
; The panel controller (ILI9341 or ST7789) is chosen at runtime, so one build
; covers both board revisions.

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_speed = 921600
board_build.partitions = min_spiffs.csv  ; two app slots, for updates over WiFi
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.1
    links2004/WebSockets@^2.6.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
