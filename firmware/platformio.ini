; ClaudeScreen firmware for the ESP32-2432S028 ("Cheap Yellow Display")
;
;   cyd        - original board, ILI9341 panel (single micro-USB)
;   cyd_st7789 - CYD2USB variant (micro-USB + USB-C), ST7789 panel

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0

[env:cyd]
build_flags = ${env.build_flags} -DPANEL_ILI9341

[env:cyd_st7789]
build_flags = ${env.build_flags} -DPANEL_ST7789
